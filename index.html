<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Find openpilot-compatible cars near you. Browse all US-market supported models, compare trim requirements, and search marketplace listings — powered by comma.ai vehicle data." />
    <meta property="og:type"         content="website" />
    <meta property="og:url"          content="https://www.pilotcompatible.com/" />
    <meta property="og:title"        content="PilotCompatible — Find openpilot-ready cars near you" />
    <meta property="og:description"  content="Browse all US-market openpilot-compatible vehicles, compare trim requirements, and launch marketplace searches. Powered by comma.ai vehicle data." />
    <meta name="twitter:card"        content="summary" />
    <meta name="twitter:title"       content="PilotCompatible — Find openpilot-ready cars near you" />
    <meta name="twitter:description" content="Browse all US-market openpilot-compatible vehicles, compare trim requirements, and launch marketplace searches." />
    <meta name="theme-color" content="#0d4a5a" />
    <title>PilotCompatible — Find openpilot-ready cars near you</title>
    <link rel="preconnect" href="https://pagead2.googlesyndication.com" crossorigin />
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.svg" />
    <link rel="icon" type="image/svg+xml" href="/icons/icon.svg" />
    <link rel="stylesheet" href="./src/styles.css" />
  </head>
  <body>
    <main id="app"></main>
    <script type="module" src="./src/app.js"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js');
        });
      }
    </script>
    <script>
      const runWhenIdle = callback => {
        if ('requestIdleCallback' in window) {
          window.requestIdleCallback(callback, { timeout: 2000 });
        } else {
          window.setTimeout(callback, 1200);
        }
      };

      const loadScript = ({ src, async = true, crossOrigin }) => new Promise((resolve, reject) => {
        const script = document.createElement('script');
        script.src = src;
        script.async = async;
        if (crossOrigin) script.crossOrigin = crossOrigin;
        script.onload = resolve;
        script.onerror = reject;
        document.head.append(script);
      });

      window.addEventListener('load', () => {
        runWhenIdle(() => {
          loadScript({
            src: 'https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-4983054307543608',
            crossOrigin: 'anonymous',
          }).catch(() => {});
        });
      });

      const hasIdentityToken = /(?:invite|confirmation|recovery|email_change)_token=/.test(window.location.hash);
      if (hasIdentityToken) {
        loadScript({ src: 'https://identity.netlify.com/v1/netlify-identity-widget.js' }).then(() => {
          if (window.netlifyIdentity) {
            window.netlifyIdentity.on('init', user => {
              if (!user) {
                window.netlifyIdentity.on('login', () => {
                  document.location.href = '/admin/';
                });
              }
            });
            window.netlifyIdentity.init();
          }
        }).catch(() => {});
      }
    </script>
  </body>
</html>
